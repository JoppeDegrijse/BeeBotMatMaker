<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afbeelding in vierkanten</title>
<style>
:root{--bg:#faf8f5;--fg:#1f1d1a;--mut:#6b665e;--card:#fff;--line:#e2ddd4;--acc:#2f6f5e;--accfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--fg:#efebe4;--mut:#a09a8f;--card:#22201d;--line:#37342f;--acc:#6fc2a9;--accfg:#10231d}}
:root[data-theme="dark"]{--bg:#171614;--fg:#efebe4;--mut:#a09a8f;--card:#22201d;--line:#37342f;--acc:#6fc2a9;--accfg:#10231d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{position:relative;display:block;border:2px dashed var(--line);border-radius:12px;padding:26px 12px;text-align:center;cursor:pointer;color:var(--mut)}
.drop.over{border-color:var(--acc)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
label.l{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:12px;align-items:center}
input[type=range]{flex:1;accent-color:var(--acc)}
input[type=number]{width:84px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.info{color:var(--mut);font-size:.9rem;margin-top:8px}
.out{overflow-x:auto;text-align:center}
canvas{max-width:100%;height:auto;border-radius:6px}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--accfg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
button:disabled{opacity:.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Afbeelding in vierkanten</h1>
  <p class="sub">Upload een foto, kies het aantal kolommen en rijen en krijg een perfect aansluitend raster.</p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <span id="droptxt">Tik om een afbeelding te kiezen (of sleep ze hierheen)</span>
    </label>
  </div>

  <div class="card" id="ctrl" hidden>
    <label class="l" for="cn">Kolommen (breedte)</label>
    <div class="row">
      <input type="range" id="cr" min="1" max="20" value="4">
      <input type="number" id="cn" min="1" max="50" value="4">
    </div>
    <label class="l" for="rn" style="margin-top:14px">Rijen (hoogte)</label>
    <div class="row">
      <input type="range" id="rr" min="1" max="20" value="3">
      <input type="number" id="rn" min="1" max="50" value="3">
    </div>
    <label class="l" for="gap" style="margin-top:14px">Tussenruimte (enkel voorbeeld)</label>
    <div class="row"><input type="range" id="gap" min="0" max="30" value="3"></div>
    <div class="info" id="info"></div>
  </div>

  <div class="card out" id="outcard" hidden>
    <canvas id="cv"></canvas>
  </div>

  <div id="dl" hidden>
    <button id="zipbtn">Download alle vierkanten (zip)</button>
    <div class="info" id="status"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let img = null, g = null, downloads = true;

const clampN = v => Math.max(1, Math.min(50, parseInt(v) || 1));

function makeGrid(W, H, c, r) {
  const s = Math.ceil(Math.min(W / c, H / r));   // zijde van een vierkant (px)
  const k = Math.max(c * s / W, r * s / H);      // vergroting zodat alle vierkanten gevuld zijn
  const ss = s / k;                              // zijde in de originele afbeelding
  const loss = 1 - (c * ss * r * ss) / (W * H);  // deel van de afbeelding dat wegvalt
  return { c, r, s, k, ss, cnt: c * r, loss };
}

function render() {
  if (!img) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  g = makeGrid(W, H, clampN($("cn").value), clampN($("rn").value));
  g.ox = (W - g.c * g.ss) / 2;
  g.oy = (H - g.r * g.ss) / 2;
  const gp = Math.round(g.s * $("gap").value / 100);
  const cv = $("cv"), ctx = cv.getContext("2d");
  cv.width = g.c * g.s + (g.c - 1) * gp;
  cv.height = g.r * g.s + (g.r - 1) * gp;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingQuality = "high";
  for (let i = 0; i < g.r; i++)
    for (let j = 0; j < g.c; j++)
      ctx.drawImage(img, g.ox + j * g.ss, g.oy + i * g.ss, g.ss, g.ss, j * (g.s + gp), i * (g.s + gp), g.s, g.s);
  let t = g.cnt + " vierkanten (" + g.c + " × " + g.r + "), elk " + g.s + " × " + g.s + " px.";
  const up = Math.round((g.k - 1) * 100);
  if (up > 0) t += " De afbeelding is " + up + "% vergroot zodat alle vierkanten gevuld zijn.";
  const cut = Math.round(g.loss * 100);
  if (cut > 0) t += " Daardoor valt " + cut + "% van de afbeelding (aan de randen) buiten het raster.";
  $("info").textContent = t;
}

function load(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    $("droptxt").textContent = file.name + " (" + im.naturalWidth + " × " + im.naturalHeight + " px) — tik om te wijzigen";
    ["ctrl", "outcard"].forEach(i => $(i).hidden = false);
    $("dl").hidden = !downloads;
    render();
  };
  im.src = url;
}

$("file").addEventListener("change", e => load(e.target.files[0]));
const drop = $("drop");
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => load(e.dataTransfer.files[0]));

[["cr", "cn"], ["rr", "rn"]].forEach(([rg, nm]) => {
  $(rg).addEventListener("input", e => { $(nm).value = e.target.value; render(); });
  $(nm).addEventListener("input", e => { const v = parseInt(e.target.value); if (v) $(rg).value = Math.min(v, 20); render(); });
});
$("gap").addEventListener("input", render);

$("zipbtn").addEventListener("click", async () => {
  if (!img || !g || !downloads) return;
  const btn = $("zipbtn"), st = $("status");
  btn.disabled = true;
  try {
    const zip = new JSZip(), t = document.createElement("canvas");
    t.width = t.height = g.s;
    const tc = t.getContext("2d");
    tc.imageSmoothingQuality = "high";
    for (let i = 0; i < g.r; i++)
      for (let j = 0; j < g.c; j++) {
        st.textContent = "Bezig… " + (i * g.c + j + 1) + " / " + g.cnt;
        tc.clearRect(0, 0, g.s, g.s);
        tc.drawImage(img, g.ox + j * g.ss, g.oy + i * g.ss, g.ss, g.ss, 0, 0, g.s, g.s);
        const blob = await new Promise(res => t.toBlob(res, "image/png"));
        zip.file("vierkant_rij" + (i + 1) + "_kolom" + (j + 1) + ".png", blob);
      }
    const out = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(out);
    a.download = "vierkanten.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    st.textContent = "Klaar: " + g.cnt + " vierkanten, genummerd per rij en kolom.";
  } catch (e) {
    st.textContent = "Downloaden is niet gelukt.";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
